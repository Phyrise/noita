<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101512"><title>Noita · Spells & perks</title><style>:root{color-scheme:dark;--bg:#101512;--panel:#1a231c;--line:#3d4b3e;--muted:#b7c4b6;--ink:#f2f5ee;--green:#c4e8a3;--accent:#e3c684}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,sans-serif}
.shell{max-width:1440px;margin:auto;padding:0 28px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;border-bottom:1px solid var(--line)}

.finder{position:sticky;top:0;background:var(--bg);z-index:2;padding:18px 0;border-bottom:1px solid var(--line)}
.searchbox{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#202c22;border:1px solid #758b6c;border-radius:8px}.searchbox:focus-within{border-color:var(--green);box-shadow:0 0 0 2px #c4e8a325}.searchbox>span{font-size:30px;color:var(--green);line-height:1}input{background:transparent;border:0;outline:0;color:var(--ink);width:100%;min-width:0;font-size:22px}input::placeholder{color:#b4c2b0}kbd{font:16px system-ui;color:var(--muted);border:1px solid #6c7f64;padding:0 8px;border-radius:4px}
.controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}.tabs,.selects{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:8px 20px}.selects button,.selects select{font-size:16px}button[aria-pressed=true]{background:var(--green);color:#15200f;border-color:var(--green)}
.resultbar{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:15px;padding:2px 0}.resultbar span{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0;display:flex;flex-direction:column}.card:hover{border-color:#829b78}
.card-head{display:grid;grid-template-columns:64px minmax(0,1fr) 76px;align-items:center;gap:16px}.sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;background:#101711;border-radius:6px}.card h2{font-size:23px;line-height:1.25;margin:0;font-weight:750;overflow-wrap:anywhere}

.card-bottom{margin-top:auto;display:flex;align-items:center;gap:12px}.kind{color:var(--muted);font-size:14px;text-transform:uppercase;font-weight:650}.proof{border:0;font-size:14px;color:var(--muted);margin-left:auto;padding:5px 0;text-decoration:underline;text-underline-offset:3px}.save{border:0;padding:0 4px;color:#c0ceb9;font-size:27px;line-height:1.2}.save[aria-pressed=true]{background:transparent;color:var(--accent)}
#more{display:block;margin:24px auto}.eyebrow{font-size:17px;color:var(--green);font-weight:750;margin:0 28px 16px 0}.lang{color:var(--muted);font-size:14px}
dialog{background:var(--panel);color:var(--ink);border:1px solid #758b6c;border-radius:10px;width:min(760px,calc(100% - 28px));padding:30px;max-height:90vh;line-height:1.6}dialog::backdrop{background:#050905cc}dialog h2{font-size:29px;line-height:1.2;margin:10px 28px 20px 0}dialog p,dialog li{font-size:18px;color:#e0e8da}.close{position:absolute;right:16px;top:12px;border:0;font-size:30px;padding:0 6px}.source-links{display:flex;flex-direction:column;gap:12px;font-size:16px}.evidence{display:flex;gap:16px;margin:22px 0;flex-wrap:wrap}.evidence figure{margin:0;background:#101711;padding:14px;border:1px solid var(--line);border-radius:6px;flex:1;min-width:140px}.evidence img{width:100px;height:100px;object-fit:contain;image-rendering:pixelated;display:block;margin:auto}.evidence figcaption{font-size:14px;color:var(--muted);margin-top:12px;text-align:center}

@media(max-width:850px){.grid{grid-template-columns:1fr}.shell{max-width:760px;padding:0 20px 24px}.resultbar{font-size:14px}.resultbar span{font-size:13px}}

/* Display controls and density */
.shell{max-width:1800px}
.grid{grid-template-columns:repeat(var(--columns,3),minmax(0,1fr));gap:14px}
.display-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px}
.view-tabs button{font-size:15px;padding:6px 14px}
.columns-label{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:15px}
.columns-label select{padding:5px 10px;min-width:58px}
.card{container-type:inline-size;padding:18px}
.card-head{grid-template-columns:52px minmax(0,1fr) 60px;gap:12px}
.sprite{width:52px;height:52px}
.card h2{font-size:21px}
.card p{font-size:18px}
.card .tier{width:60px;min-height:66px}.card .tier strong{font-size:35px}
.card .tier[data-tier="?"]{font-size:13px}
.proof,.save{background:transparent;box-shadow:none;border:0;border-radius:5px;transition:color .12s ease,background .12s ease}
.proof{padding:6px 5px;text-decoration:none;color:#bdcbb7}
.save{padding:3px 6px}
.proof:hover,.save:hover{background:#c4e8a30c;color:var(--ink)}
.save[aria-pressed=true]{background:transparent;color:var(--accent)}
.names-view{gap:5px 10px}
.name-row{min-width:0;border-bottom:1px solid #334034}
.name-link{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;min-height:41px;border:0;border-radius:5px;padding:5px 7px;background:transparent;text-align:left;color:var(--ink);font-size:15px;line-height:1.25}
.name-link>span:first-child{min-width:0;overflow-wrap:anywhere}
.name-link:hover{background:#c4e8a30c}
.compact-tier{flex-shrink:0;width:28px;min-height:28px;align-self:center;font-size:18px;font-weight:800;padding:3px;border-radius:4px}
.compact-tier[data-tier="?"]{font-size:17px;padding:3px;color:var(--muted)}
.detail-heading{display:grid;grid-template-columns:52px minmax(0,1fr) 76px;align-items:center;gap:15px;margin-top:10px;padding-right:15px}
.detail-heading h2{margin:3px 0 0}.detail-links{display:flex;gap:20px;flex-wrap:wrap;font-size:16px}
.credits{font-size:13px!important;color:var(--muted)!important;margin-top:24px}
@container(max-width:260px){.card-head{grid-template-columns:38px minmax(0,1fr) 44px;gap:8px}.sprite{width:38px;height:38px}.card h2{font-size:17px}.card p{font-size:16px}.card .tier{width:44px;min-height:53px}.card .tier strong{font-size:28px}.card .tier[data-tier="?"]{font-size:10px;padding:4px}.card-bottom{gap:5px}.kind,.proof{font-size:12px}.save{font-size:23px}}
@media(min-width:1700px){.grid{grid-template-columns:repeat(var(--columns,3),minmax(0,1fr))}}

@media(max-width:560px){.display-controls{margin-top:10px}.columns-label{font-size:14px}.name-link{font-size:14px}.detail-heading{grid-template-columns:40px minmax(0,1fr) 60px;gap:10px;padding-right:0}.detail-heading .sprite{width:40px;height:40px}.detail-heading h2{font-size:23px}.detail-heading .tier{width:60px;min-height:66px}.detail-heading .tier strong{font-size:34px}.detail-links{font-size:15px;gap:15px}}
.close{background:transparent;box-shadow:none}.close:hover{background:#c4e8a30c}
/* One sticky toolbar; the search field scrolls away. */
main>.searchbox{margin:18px 0 0}
.finder{padding:10px 0;background:var(--bg)}
.controls{margin-top:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:16px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#53664e transparent}
.controls>.tabs,.controls>.selects,.layout-tools{flex-shrink:0;flex-wrap:nowrap;align-items:center}
.controls>.tabs{gap:5px}.controls>.tabs button{padding:7px 13px;font-size:16px;white-space:nowrap}
.controls>.selects{gap:6px}.controls>.selects button,.controls>.selects select{font-size:14px;padding:8px 9px;white-space:nowrap}
.layout-tools{display:flex;gap:13px}
.view-tabs{display:flex;gap:3px;padding:3px;background:#1a231c;border:1px solid var(--line);border-radius:7px}
.view-icon{display:flex;align-items:center;justify-content:center;width:32px;height:30px;padding:5px;border:0;background:transparent;border-radius:4px;color:var(--muted)}
.view-icon svg,.columns-control>svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.view-icon:hover{background:#c4e8a30c;color:var(--ink)}.view-icon[aria-pressed=true]{color:#15200f;background:var(--green)}
.columns-control{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted)}
#columns{appearance:auto;-webkit-appearance:auto;accent-color:var(--green);width:82px;min-width:82px;height:28px;padding:0;margin:0;border:0;cursor:ew-resize;background:transparent;touch-action:pan-y}
#columns:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:5px}
#columns:disabled{cursor:default;opacity:.4}
#columns-output{min-width:16px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
@media(max-width:850px){.controls{gap:12px}.layout-tools{gap:10px}.controls>.tabs button{padding:7px 10px}.controls>.selects{gap:5px}}
@media(max-width:560px){main>.searchbox{margin-top:12px}.finder{padding:8px 0}.controls{padding-bottom:2px}.controls>.tabs button{font-size:15px}#columns{width:66px;min-width:66px}.columns-control{gap:5px}}
/* Three view buttons using the game's Add Mana sprite. */
.game-views{border-radius:4px;gap:3px}
.game-views .view-icon{width:33px;height:32px;border-radius:2px;padding:4px}
.game-views .view-icon img{width:22px;height:22px;image-rendering:pixelated;object-fit:contain;flex-shrink:0}
.game-views .with-text{width:49px;gap:3px}
.game-views .with-text img{width:20px;height:20px}
.pixel-lines{display:flex;flex-direction:column;justify-content:center;gap:4px;width:20px;height:20px}
.pixel-lines i{display:block;background:currentColor;height:2px;width:100%;box-shadow:0 1px 0 #0002}
.pixel-lines i:nth-child(2){width:75%}.pixel-lines i:nth-child(3){width:90%}
.with-text .pixel-lines{width:16px;gap:3px}
.images-view{display:flex;flex-direction:column;gap:8px}
.icon-tier{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:stretch;padding:8px;background:#182019;border:1px solid #354436;border-radius:5px}
.tier-label{width:48px;min-height:48px;height:100%;align-self:stretch;justify-content:center;font-size:28px;font-weight:800;margin:0;padding:8px 0;border-radius:3px}
.tier-label[data-tier="?"]{font-size:26px}
.icon-grid{display:grid;grid-template-columns:repeat(var(--columns,16),minmax(0,1fr));gap:5px;align-content:start}
.icon-cell{display:flex;align-items:center;justify-content:center;min-width:0;width:100%;aspect-ratio:1;padding:4px;background:#101611;border:1px solid #344735;border-radius:3px;transition:background .1s,border-color .1s}
.icon-cell img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.icon-cell:hover{background:#283b25;border-color:var(--green)}
.icon-cell:focus-visible{outline-offset:1px}
@media(max-width:560px){.icon-tier{grid-template-columns:32px minmax(0,1fr);gap:6px;padding:6px}.tier-label{width:32px;min-height:38px;font-size:22px}.tier-label[data-tier="?"]{font-size:21px}.icon-grid{gap:4px}.icon-cell{padding:3px}}

<script>'use strict';
const data=window.NOITA_DATA,meta=window.NOITA_META;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9?]+/g,' ').trim();
let saved;try{saved=JSON.parse(localStorage.getItem('noita-favorites')||'[]');if(!Array.isArray(saved))saved=[]}catch{saved=[]}
let preferences={};try{preferences=JSON.parse(localStorage.getItem('noita-display')||'{}')||{}}catch{}
const validColumns=n=>Number.isInteger(n)&&n>=1&&n<=8;
const validImageColumns=n=>Number.isInteger(n)&&n>=4&&n<=24;
const state={type:'all',tier:'all',favorites:false,verified:false,limit:48,view:['cards','names','images'].includes(preferences.view)?preferences.view:'cards',cardColumns:validColumns(preferences.cardColumns)?preferences.cardColumns:3,nameColumns:validColumns(preferences.nameColumns)?preferences.nameColumns:6,imageColumns:validImageColumns(preferences.imageColumns)?preferences.imageColumns:16},favorites=new Set(saved);
const tierLists={spell:'https://www.reddit.com/r/noita/comments/17o5pbj/a_public_branch_noita_spell_tier_list_since_i/',perk:'https://www.reddit.com/r/noita/comments/l4zrag/2500_hours_of_noita_my_general_perk_tier_list_for/#lightbox'};
function saveDisplay(){try{localStorage.setItem('noita-display',JSON.stringify({view:state.view,cardColumns:state.cardColumns,nameColumns:state.nameColumns,imageColumns:state.imageColumns}))}catch{}}
function applyLayout(){const names=state.view==='names',images=state.view==='images',columns=images?state.imageColumns:names?state.nameColumns:state.cardColumns;const imageCap=Math.max(4,Math.min(24,Math.floor((Math.min(window.innerWidth,1800)-(window.innerWidth<560?28:56)-68)/36)));const cap=images?imageCap:window.innerWidth<540?(names?2:1):window.innerWidth<850?(names?3:2):8;const visible=Math.min(columns,cap);$('#results').style.setProperty('--columns',visible);$('#results').classList.toggle('names-view',names);$('#results').classList.toggle('images-view',images);$('#columns').min=images?'4':'1';$('#columns').max=String(cap);$('#columns').value=String(visible);$('#columns').disabled=cap===(images?4:1);$('#columns').setAttribute('aria-valuetext',visible+(visible===1?' colonne':' colonnes'));$('#columns-output').textContent=String(visible);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===state.view));}
const ranks=['X','S','A','B','C','D','E','F','Z'];
// Bounded Damerau-Levenshtein: insertion, deletion, substitution and adjacent transposition.
function distance(a,b){if(Math.abs(a.length-b.length)>2)return 3;let prev2=[],prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let row=[i];for(let j=1;j<=b.length;j++){row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])row[j]=Math.min(row[j],prev2[j-2]+1)}prev2=prev;prev=row}return prev[b.length]}
const indexed=data.map(r=>({...r,key:r.type+':'+r.id,words:norm([r.name,r.fr,...r.aliases,r.description].filter(Boolean).join(' ')).split(' '),names:norm([r.name,r.fr,...r.aliases].filter(Boolean).join(' '))}));
function score(r,query){if(!query)return 1;if(r.names.includes(query))return norm(r.name)===query?100:70;const qs=query.split(' ');let sum=0;for(const q of qs){if(r.words.some(w=>w.includes(q))){sum+=12;continue}if(q.length<3)return 0;const max=q.length>=6?2:1;const d=Math.min(...r.words.filter(w=>Math.abs(w.length-q.length)<=max).map(w=>distance(q,w)));if(d>max)return 0;sum+=5-d}return sum}
function sprite(r){return `<span class="sprite sprite-atlas" aria-hidden="true" style="background-size:2400% 2300%;background-position:${r.atlasPosition}"></span>`}
function render(){const query=norm($('#search').value),rows=indexed.filter(r=>(state.type==='all'||r.type===state.type)&&(state.tier==='all'||(state.tier==='unknown'?!r.tier:r.tier===state.tier))&&(!state.favorites||favorites.has(r.key))&&(!state.verified||r.tier)).map(r=>({r,s:score(r,query)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||(a.r.tier?ranks.indexOf(a.r.tier):99)-(b.r.tier?ranks.indexOf(b.r.tier):99)||a.r.name.localeCompare(b.r.name));
$('#count').textContent=`${rows.length} résultat${rows.length>1?'s':''}${query?' pour « '+$('#search').value+' »':''}`;
applyLayout();
if(state.view==='images'){$('#results').innerHTML=renderImages(rows)}else{
$('#results').innerHTML=rows.slice(0,state.view==='names'?rows.length:state.limit).map(({r})=>state.view==='names'?`<article class="name-row"><button class="name-link" data-detail="${esc(r.key)}" title="${esc(r.type+': '+r.description)}" aria-label="${esc(r.name+', '+r.type+', '+(r.tier?'tier '+r.tier:'non vérifié'))}"><span>${esc(r.name)}</span><span class="tier compact-tier" data-tier="${r.tier||'?'}">${r.tier||'?'}</span></button></article>`:`<article class="card"><div class="card-head">${sprite(r)}<h2>${esc(r.name)}</h2><span class="tier" data-tier="${r.tier||'?'}" aria-label="${r.tier?'Tier '+r.tier:'Non vérifié'}">${r.tier?'<small>TIER</small><strong>'+r.tier+'</strong>':'Non vérifié'}</span></div><p>${esc(r.description)}</p><div class="card-bottom"><span class="kind">${r.type}</span><button class="proof" data-detail="${esc(r.key)}">Détails ↗</button><button class="save" data-save="${esc(r.key)}" aria-pressed="${favorites.has(r.key)}" aria-label="${favorites.has(r.key)?'Retirer des':'Ajouter aux'} favoris : ${esc(r.name)}">${favorites.has(r.key)?'★':'☆'}</button></div></article>`).join('');
}
$('#empty').hidden=rows.length>0;$('#more').hidden=state.view!=='cards'||rows.length<=state.limit;$('#more').textContent=`Afficher plus (${Math.max(0,rows.length-state.limit)} restants)`;
}
function renderImages(rows){return [...ranks,'?'].map(tier=>{const group=rows.filter(({r})=>(r.tier||'?')===tier);if(!group.length)return '';return `<section class="icon-tier" aria-label="${tier==='?'?'Non vérifié':'Tier '+tier}"><h2 class="tier tier-label" data-tier="${tier}" title="${tier==='?'?'Non vérifié':'Tier '+tier}">${tier}</h2><div class="icon-grid">${group.map(({r})=>`<button class="icon-cell" data-detail="${esc(r.key)}" title="${esc(r.name+' · '+r.type+' · '+(r.tier?'Tier '+r.tier:'Non vérifié'))}" aria-label="${esc(r.name+', '+r.type+', '+(r.tier?'tier '+r.tier:'non vérifié'))}">${sprite(r)}</button>`).join('')}</div></section>`}).join('')}
function details(key){const r=indexed.find(r=>r.key===key);if(!r)return;
$('#detail-body').innerHTML=`<div class="detail-heading">${sprite(r)}<div><span class="kind">${r.type}</span><h2>${esc(r.name)}</h2></div><span class="tier" data-tier="${r.tier||'?'}">${r.tier?'<small>TIER</small><strong>'+r.tier+'</strong>':'Non vérifié'}</span></div><p>${esc(r.description)}</p><div class="detail-links"><a href="${esc(r.wiki)}" target="_blank" rel="noreferrer">Noita Wiki ↗</a><a href="${tierLists[r.type]}" target="_blank" rel="noreferrer">Tier list · Reddit ↗</a></div>`;
$('#details').showModal();}
function sources(){const s=meta.stats;$('#source-body').innerHTML=`<p>${s.spell.catalogue} spells · ${s.perk.catalogue} perks</p><div class="source-links"><a href="${tierLists.spell}" target="_blank" rel="noreferrer">Tier list spells · Reddit ↗</a><a href="${tierLists.perk}" target="_blank" rel="noreferrer">Tier list perks · Reddit ↗</a></div><p>Wiki : <a href="https://noita.wiki.gg/wiki/Spells" target="_blank" rel="noreferrer">Spells</a> · <a href="https://noita.wiki.gg/wiki/Perks" target="_blank" rel="noreferrer">Perks</a><br>Consulté le 25 octobre 2026.</p><p class="credits">Textes : contributeurs du Noita Wiki, <a href="https://creativecommons.org/licenses/by-nc-sa/3.0/" target="_blank" rel="noreferrer">CC BY-NC-SA 3.0</a>. Sprites : Noita / Nolla Games.</p>`;$('#sources').showModal()}
$('#coverage').textContent=`${meta.stats.spell.catalogue} spells · ${meta.stats.perk.catalogue} perks`;
$('#search').addEventListener('input',()=>{state.limit=48;render()});
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{state.type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',x===b));state.limit=48;render()}));
$('#tier').addEventListener('change',e=>{state.tier=e.target.value;state.limit=48;render()});
for(const id of ['favorites','verified'])$('#'+id).addEventListener('click',()=>{state[id]=!state[id];$('#'+id).setAttribute('aria-pressed',state[id]);state.limit=48;render()});
$('#results').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.save){const key=b.dataset.save;favorites.has(key)?favorites.delete(key):favorites.add(key);try{localStorage.setItem('noita-favorites',JSON.stringify([...favorites]))}catch{}render()}else if(b.dataset.detail)details(b.dataset.detail)});
$('#more').addEventListener('click',()=>{state.limit+=48;render()});
$('#reset').addEventListener('click',()=>{$('#search').value='';$('#tier').value='all';Object.assign(state,{type:'all',tier:'all',favorites:false,verified:false,limit:48});document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.type==='all'));for(const id of ['favorites','verified'])$('#'+id).setAttribute('aria-pressed','false');render();$('#search').focus()});
$('#about').addEventListener('click',sources);
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;saveDisplay();render()}));
$('#columns').addEventListener('input',e=>{const n=Number(e.target.value);if(!(state.view==='images'?validImageColumns(n):validColumns(n)))return;if(state.view==='images')state.imageColumns=n;else if(state.view==='names')state.nameColumns=n;else state.cardColumns=n;saveDisplay();applyLayout()});
window.addEventListener('resize',applyLayout);
document.querySelectorAll('dialog').forEach(d=>{d.querySelector('.close').addEventListener('click',()=>d.close());d.addEventListener('click',e=>{if(e.target===d){const b=d.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)d.close()}})});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();$('#search').focus()}});
render();
</script>
